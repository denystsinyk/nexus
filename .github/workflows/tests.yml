name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ExifTool
        run: python3 scripts/setup_exiftool.py
      - name: Check prerequisites
        run: python3 -m nexus doctor
      - name: Test archive behavior
        run: python3 -m unittest discover -v
